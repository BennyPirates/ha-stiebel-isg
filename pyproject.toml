[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["docs/vendor", "results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
files = ["src/stiebel_isg_probe.py"]
exclude = ["docs/vendor", "results"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
warn_unused_configs = true
